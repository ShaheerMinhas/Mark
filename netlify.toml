[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Set in Netlify → Site settings → Environment variables:
# VITE_API_URL = https://YOUR-MARK-SERVICE.up.railway.app
#
# prebuild.mjs writes public/_redirects to proxy /api/* → Railway
# so the React app can use relative /api paths (no CORS issues).

[build.environment]
  NODE_VERSION = "20"
